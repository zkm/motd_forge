name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # RubyGems trusted publishing (OIDC)
      packages: write # GitHub Packages
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rubocop
      - run: bundle exec rake spec

      - name: Check the release tag matches the gem version
        run: |
          version="v$(ruby -Ilib -e 'require "motd_forge/version"; print MotdForge::VERSION')"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match gem version $version"
            exit 1
          fi

      - run: bundle exec rake build

      # Runs before the RubyGems credentials step, which sets GEM_HOST_API_KEY
      # for every later step
      - name: Publish to GitHub Packages
        run: gem push --host https://rubygems.pkg.github.com/zkm pkg/motd_forge-*.gem
        env:
          GEM_HOST_API_KEY: "Bearer ${{ secrets.GITHUB_TOKEN }}"

      - uses: rubygems/configure-rubygems-credentials@v2.1.0
      - name: Publish to RubyGems.org
        run: gem push pkg/motd_forge-*.gem
